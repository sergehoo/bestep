# pyproject.toml — Outillage qualité (V8.B).
#
# CORRECTIFS audit (SEC-30, INFRA-19) :
# - Configuration ruff + black + isort cohérente.
# - pytest configuré pour Django.
# - Couverture cible 60% à terme.

[tool.ruff]
target-version = "py311"
line-length = 100
extend-exclude = [
  "migrations",
  "staticfiles",
  "venv",
  ".venv",
  "node_modules",
]

[tool.ruff.lint]
select = [
  "E",   # pycodestyle
  "F",   # pyflakes
  "I",   # imports
  "B",   # bugbear
  "UP",  # modernisation Python
  "C90", # complexité
  "DJ",  # Django
  "RUF", # règles Ruff
]
ignore = [
  "E501",   # dette historique de longueur, gérée par le formateur
  "B008",   # expressions Django légitimes dans les valeurs par défaut
  "C901",   # complexité historique à réduire module par module
  "DJ008",  # modèles abstraits et modèles gérés hors admin
  "DJ012",  # ordre historique des méthodes de modèles
  "RUF001", # typographie française intentionnelle
  "RUF002", # typographie française intentionnelle
  "RUF003", # typographie française intentionnelle
  "RUF012", # attributs de classes Django déclaratifs
]

[tool.ruff.lint.per-file-ignores]
"**/migrations/*.py" = ["E", "F", "I", "B", "C90"]
"tests/*.py" = ["E501", "B"]
"manage.py" = ["E"]

[tool.ruff.lint.mccabe]
max-complexity = 12

[tool.black]
line-length = 100
target-version = ["py311"]
extend-exclude = '''
(
  migrations
  | staticfiles
  | venv
  | \.venv
)
'''

[tool.isort]
profile = "black"
line_length = 100
known_first_party = [
  "best_epargne",
  "core",
  "compte",
  "organizations",
  "catalog",
  "assessments",
  "certifications",
  "commerce",
  "enrollments",
  "reviews",
  "formations",
]
skip = ["migrations", "staticfiles", "venv", ".venv"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "best_epargne.settings.dev"
python_files = ["test_*.py", "*_test.py", "tests.py"]
testpaths = ["tests"]
addopts = [
  "-ra",
  "--strict-markers",
  "--strict-config",
  "--reuse-db",
]
filterwarnings = [
  "ignore::DeprecationWarning",
  "ignore::PendingDeprecationWarning",
]
markers = [
  "slow: tests lents (pipeline vidéo, certs)",
  "integration: tests d'intégration (DB, Redis, MinIO)",
]

[tool.coverage.run]
source = [
  "core",
  "compte",
  "organizations",
  "catalog",
  "assessments",
  "certifications",
  "commerce",
  "enrollments",
  "reviews",
  "formations",
  "best_epargne",
]
omit = [
  "*/migrations/*",
  "*/management/*",
  "*/tests.py",
  "*/admin.py",
  "manage.py",
  "*/wsgi.py",
  "*/asgi.py",
  "*/celery.py",
  "venv/*",
  "staticfiles/*",
]

[tool.coverage.report]
show_missing = true
skip_covered = false
precision = 1
fail_under = 30
exclude_lines = [
  "pragma: no cover",
  "raise NotImplementedError",
  "if __name__ == .__main__.:",
  "if TYPE_CHECKING:",
]
