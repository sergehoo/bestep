{% extends "layout/learner_base.html" %}
{% load static %}

{% block title %}Continuer le cours{% endblock %}
{% block topbar_subtitle %}Continuer{% endblock %}

{% block content %}
    <script id="player-config" type="application/json">
        {
          "courseId": {{ course_id|default:"null" }},
  "api": {
    "outline": "/api/learner/courses/{{ course_id }}/outline/",
    "continue": "/api/learner/courses/{{ course_id }}/continue/",
    "lessonStateBase": "/api/learner/courses/{{ course_id }}/lessons/",
    "lessonProgressBase": "/api/learner/courses/{{ course_id }}/lessons/",
    "setCurrent": "/api/learner/courses/{{ course_id }}/set-current/"
  }
}
    </script>

    <style>
        .no-scrollbar::-webkit-scrollbar {
            width: 0;
            height: 0;
        }

        .no-scrollbar {
            scrollbar-width: none;
            -ms-overflow-style: none;
        }

        .will-change-transform {
            will-change: transform;
        }

        .gpu {
            transform: translateZ(0);
        }

        .toast {
            position: fixed;
            right: 16px;
            bottom: 16px;
            z-index: 70;
            background: rgba(15, 23, 42, .92);
            color: #fff;
            padding: 10px 12px;
            border-radius: 14px;
            box-shadow: 0 18px 50px rgba(2, 6, 23, .25);
            font-size: 12px;
        }
    </style>

    <div class="relative" x-data="coursePlayerUdemy()" x-init="init()">
        <!-- Toast -->
        <div x-show="ui.toast.show" x-transition.opacity class="toast" style="display:none">
            <div class="flex items-center gap-2">
                <i class="fa-solid fa-circle-check text-emerald-400" x-show="ui.toast.type==='ok'"></i>
                <i class="fa-solid fa-triangle-exclamation text-amber-300" x-show="ui.toast.type==='warn'"></i>
                <i class="fa-solid fa-cloud-arrow-up text-sky-300" x-show="ui.toast.type==='sync'"></i>
                <span x-text="ui.toast.msg"></span>
            </div>
        </div>

        <!-- Top bar -->
        <div class="sticky top-0 z-40 bg-slate-950 text-white border-b border-white/10">
            <div class="px-3 sm:px-5 py-3 flex items-center justify-between gap-3">
                <div class="min-w-0 flex items-center gap-3">
                    <button
                            class="lg:hidden inline-flex items-center justify-center w-10 h-10 rounded-xl bg-white/10 hover:bg-white/15 active:scale-[.98] transition"
                            @click="ui.sidebarOpen = !ui.sidebarOpen"
                            aria-label="Ouvrir le plan"
                            type="button"
                    >
                        <i class="fa-solid fa-bars"></i>
                    </button>

                    <div class="min-w-0">
                        <div class="text-sm font-semibold truncate" x-text="course.title || 'Cours'"></div>
                        <div class="text-[11px] text-white/70 flex items-center gap-2">
                            <span class="truncate max-w-[46vw] sm:max-w-[420px]"
                                  x-text="lesson.title || 'Leçon'"></span>
                            <span class="opacity-60">•</span>
                            <span>Progression</span>
                            <span class="font-semibold" x-text="(progress.percent || 0) + '%'"></span>
                            <span class="opacity-60" x-show="saving.any">•</span>
                            <span class="text-sky-200 font-semibold" x-show="saving.any">
                            <i class="fa-solid fa-cloud-arrow-up mr-1"></i>Sync…
                        </span>
                        </div>
                    </div>
                </div>

                <div class="flex items-center gap-2 shrink-0">
                    <button
                            class="hidden sm:inline-flex px-3 py-2 rounded-xl bg-white/10 hover:bg-white/15 text-sm font-semibold active:scale-[.98] transition"
                            @click="refreshOutline(true)"
                            :disabled="loading.outline"
                            type="button"
                    >
                        <i class="fa-solid fa-rotate mr-2"></i>Actualiser
                    </button>

                    <div class="hidden sm:flex items-center gap-2">
                        <div class="w-44 h-2 rounded-full bg-white/10 overflow-hidden">
                            <div
                                    class="h-full bg-emerald-400 rounded-full transition-all duration-300"
                                    :style="`width:${progress.percent || 0}%`"
                            ></div>
                        </div>
                        <div class="text-[11px] text-white/70">
                            <span x-text="progress.completed_lessons || 0"></span>/<span
                                x-text="progress.total_lessons || 0"></span>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Main layout -->
        <div class="grid lg:grid-cols-12 gap-0">
            <!-- Mobile overlay -->
            <div
                    class="lg:hidden fixed inset-0 z-40 bg-black/50"
                    x-show="ui.sidebarOpen"
                    x-transition.opacity
                    @click="ui.sidebarOpen = false"
                    style="display:none"
            ></div>

            <!-- Sidebar -->
            <aside
                    class="lg:col-span-4 xl:col-span-3 bg-white border-r border-be-ink-100 lg:sticky lg:top-[56px] lg:h-[calc(100vh-56px)] z-50"
                    :class="ui.sidebarOpen ? 'fixed inset-y-0 left-0 w-[88%] max-w-sm shadow-2xl' : 'hidden lg:block'"
                    x-show="ui.sidebarOpen || ui.isDesktop"
                    x-transition
                    style="display:none"
            >
                <div class="p-4 border-b border-be-ink-100">
                    <div class="flex items-start justify-between gap-2">
                        <div class="min-w-0">
                            <div class="text-sm font-extrabold text-slate-900 truncate"
                                 x-text="course.title || 'Cours'"></div>
                            <div class="text-xs text-be-ink-500 mt-1">
                                <span class="font-semibold" x-text="(progress.percent || 0) + '%'"></span>
                                • <span x-text="progress.completed_lessons || 0"></span>/<span
                                    x-text="progress.total_lessons || 0"></span>
                                <span class="ml-2" x-show="saving.any">
                                <i class="fa-solid fa-cloud-arrow-up mr-1"></i>Sync…
                            </span>
                            </div>
                        </div>

                        <button
                                class="lg:hidden w-10 h-10 rounded-xl border border-be-ink-100 hover:bg-be-ink-50 active:scale-[.98] transition"
                                @click="ui.sidebarOpen = false"
                                aria-label="Fermer"
                                type="button"
                        >
                            <i class="fa-solid fa-xmark"></i>
                        </button>
                    </div>

                    <div class="mt-3 h-2 rounded-full bg-be-ink-100 overflow-hidden">
                        <div
                                class="h-full rounded-full bg-be-sky-600 transition-all duration-300"
                                :style="`width:${progress.percent || 0}%`"
                        ></div>
                    </div>

                    <div class="mt-4">
                        <div class="relative">
                            <i class="fa-solid fa-magnifying-glass absolute left-3 top-1/2 -translate-y-1/2 text-be-ink-400 text-sm"></i>
                            <input
                                    x-model.debounce.200ms="ui.search"
                                    placeholder="Rechercher une leçon…"
                                    class="w-full pl-10 pr-4 py-2.5 rounded-xl border border-be-ink-100/70 bg-white/80 focus:outline-none focus:ring-4 focus:ring-be-sky-200/60 text-sm"
                                    type="text"
                            />
                        </div>
                    </div>

                    <div class="mt-3 flex items-center gap-2">
                        <button
                                class="px-3 py-2 rounded-xl border border-be-ink-100 hover:bg-be-ink-50 text-xs font-semibold active:scale-[.98] transition"
                                @click="expandAll(true)"
                                type="button"
                        >
                            Tout ouvrir
                        </button>
                        <button
                                class="px-3 py-2 rounded-xl border border-be-ink-100 hover:bg-be-ink-50 text-xs font-semibold active:scale-[.98] transition"
                                @click="expandAll(false)"
                                type="button"
                        >
                            Tout fermer
                        </button>
                    </div>
                </div>

                <div class="p-3 overflow-auto no-scrollbar" style="height: calc(100% - 184px)">
                    <template x-if="loading.outline">
                        <div class="p-3">
                            <div class="text-sm text-be-ink-500">Chargement du plan…</div>
                            <div class="mt-3 space-y-2">
                                <div class="h-10 rounded-xl bg-be-ink-100/70 animate-pulse"></div>
                                <div class="h-10 rounded-xl bg-be-ink-100/70 animate-pulse"></div>
                                <div class="h-10 rounded-xl bg-be-ink-100/70 animate-pulse"></div>
                            </div>
                        </div>
                    </template>

                    <template x-if="!loading.outline && filteredSections().length === 0">
                        <div class="p-3 text-sm text-be-ink-500">Aucun résultat.</div>
                    </template>

                    <template x-for="s in filteredSections()" :key="s.id">
                        <div class="mb-3 rounded-2xl border border-be-ink-100 overflow-hidden">
                            <button
                                    class="w-full px-3 py-3 flex items-center justify-between gap-3 bg-white hover:bg-be-ink-50 active:scale-[.99] transition"
                                    @click="toggleSection(s.id)"
                                    type="button"
                            >
                                <div class="min-w-0 text-left">
                                    <div class="text-xs font-extrabold text-slate-900 truncate" x-text="s.title"></div>
                                    <div class="text-[11px] text-be-ink-500 mt-1">
                                        <span x-text="countCompleted(s)"></span>/<span
                                            x-text="(s.lessons || []).length"></span> leçons terminées
                                    </div>
                                </div>
                                <i class="fa-solid fa-chevron-down text-be-ink-400 transition"
                                   :class="ui.openSections[s.id] ? 'rotate-180' : ''"></i>
                            </button>

                            <div x-show="ui.openSections[s.id]" x-transition
                                 class="border-t border-be-ink-100 bg-white">
                                <template x-for="l in (s.lessons || [])" :key="l.id">
                                    <button
                                            class="w-full text-left px-3 py-2.5 flex items-center gap-3 hover:bg-be-ink-50 active:scale-[.99] transition"
                                            :class="Number(l.id) === Number(currentLessonId) ? 'bg-be-sky-50' : ''"
                                            @click="openLesson(l.id)"
                                            type="button"
                                    >
                                        <div
                                                class="w-9 h-9 rounded-xl flex items-center justify-center shrink-0"
                                                :class="l.is_completed ? 'bg-emerald-100 text-emerald-700' : (Number(l.id) === Number(currentLessonId) ? 'bg-be-sky-100 text-be-sky-700' : 'bg-be-ink-50 text-be-ink-600')"
                                        >
                                            <template x-if="l.type === 'VIDEO'"><i class="fa-solid fa-circle-play"></i>
                                            </template>
                                            <template x-if="l.type === 'TEXT'"><i class="fa-solid fa-file-lines"></i>
                                            </template>
                                            <template x-if="l.type === 'QUIZ'"><i
                                                    class="fa-solid fa-circle-question"></i></template>
                                            <template x-if="l.type === 'LIVE'"><i
                                                    class="fa-solid fa-tower-broadcast"></i></template>
                                            <template x-if="l.type === 'FILE'"><i class="fa-solid fa-paperclip"></i>
                                            </template>
                                            <template x-if="!['VIDEO','TEXT','QUIZ','LIVE','FILE'].includes(l.type)">
                                                <i class="fa-solid fa-circle"></i>
                                            </template>
                                        </div>

                                        <div class="min-w-0 flex-1">
                                            <div class="text-sm font-semibold text-slate-900 truncate"
                                                 x-text="l.title"></div>
                                            <div class="mt-1 flex items-center gap-2 text-[11px] text-be-ink-500">
                                                <span x-text="l.type"></span>
                                                <span class="opacity-60">•</span>
                                                <span x-text="(l.percent ?? 0) + '%'"></span>
                                                <span class="ml-1" x-show="l.is_completed">✅</span>
                                            </div>

                                            <div class="mt-2 h-1.5 rounded-full bg-be-ink-100 overflow-hidden">
                                                <div
                                                        class="h-full rounded-full bg-be-sky-600 transition-all duration-300"
                                                        :style="`width:${l.percent ?? 0}%`"
                                                ></div>
                                            </div>
                                        </div>

                                        <div class="text-[11px] font-semibold text-be-ink-600 shrink-0">
                                            <span x-text="formatDuration(l.duration_sec)"></span>
                                        </div>
                                    </button>
                                </template>
                            </div>
                        </div>
                    </template>
                </div>
            </aside>

            <!-- Player -->
            <section class="lg:col-span-8 xl:col-span-9 bg-white lg:sticky lg:top-[56px] lg:h-[calc(100vh-56px)]">
                <div class="border-b border-be-ink-100 bg-white px-4 py-3 flex items-center justify-between gap-3">
                    <div class="min-w-0">
                        <div class="text-sm font-extrabold text-slate-900 truncate"
                             x-text="lesson.title || 'Leçon'"></div>
                        <div class="text-xs text-be-ink-500 mt-1 flex flex-wrap items-center gap-2">
                        <span class="inline-flex items-center gap-2 px-2.5 py-1 rounded-full bg-be-ink-50 border border-be-ink-100">
                            <span class="font-semibold" x-text="lesson.type || ''"></span>
                        </span>
                            <span class="opacity-60">•</span>
                            <span>Progress:</span>
                            <span class="font-semibold" x-text="(lessonProgress.percent || 0) + '%'"></span>
                            <span class="opacity-60">•</span>
                            <span x-show="lessonProgress.is_completed"
                                  class="text-emerald-700 font-semibold">✅ Terminé</span>
                        </div>
                    </div>

                    <div class="flex items-center gap-2 shrink-0">
                        <button
                                class="px-3 py-2 rounded-xl border border-be-ink-100 hover:bg-be-ink-50 text-sm font-semibold active:scale-[.98] transition"
                                @click="prevLesson()"
                                :disabled="!nav.prevId || loading.lesson"
                                :class="(!nav.prevId || loading.lesson) ? 'opacity-50 cursor-not-allowed' : ''"
                                type="button"
                        >
                            ← Préc.
                        </button>

                        <button
                                class="px-3 py-2 rounded-xl border border-be-ink-100 hover:bg-be-ink-50 text-sm font-semibold active:scale-[.98] transition"
                                @click="toggleCompleted()"
                                :disabled="loading.lesson"
                                :class="loading.lesson ? 'opacity-50 cursor-not-allowed' : ''"
                                type="button"
                        >
                            <span x-show="!lessonProgress.is_completed">Marquer terminé</span>
                            <span x-show="lessonProgress.is_completed">Marquer non terminé</span>
                        </button>

                        <button
                                class="px-3 py-2 rounded-xl bg-slate-900 text-white hover:opacity-90 text-sm font-semibold active:scale-[.98] transition"
                                @click="nextLesson()"
                                :disabled="!nav.nextId || loading.lesson"
                                :class="(!nav.nextId || loading.lesson) ? 'opacity-50 cursor-not-allowed' : ''"
                                type="button"
                        >
                            Suivant →
                        </button>
                    </div>
                </div>

                <div
                        x-ref="playerScroll"
                        class="p-4 lg:p-6 overflow-auto no-scrollbar gpu"
                        style="height: calc(100% - 58px)"
                >
                    <template x-if="loading.lesson">
                        <div class="space-y-4">
                            <div class="h-7 w-1/2 rounded-xl bg-be-ink-100/70 animate-pulse"></div>
                            <div class="h-64 rounded-2xl bg-be-ink-100/70 animate-pulse"></div>
                            <div class="h-24 rounded-2xl bg-be-ink-100/70 animate-pulse"></div>
                        </div>
                    </template>

                    <template x-if="!loading.lesson">
                        <div class="space-y-5">
                            <!-- VIDEO -->
                            <template x-if="lesson.type === 'VIDEO' && lesson.video_url">
                                <div class="rounded-2xl border border-be-ink-100 overflow-hidden bg-black">
                                    <template x-if="isMp4(lesson.video_url)">
                                        <video
                                                x-ref="videoEl"
                                                class="w-full"
                                                controls
                                                playsinline
                                                preload="metadata"
                                                @timeupdate="onVideoTimeUpdate()"
                                                @ended="onVideoEnded()"
                                                @loadedmetadata="onVideoLoaded()"
                                                :src="lesson.video_url"
                                                style="max-height: 520px"
                                        ></video>
                                    </template>

                                    <template x-if="!isMp4(lesson.video_url)">
                                        <iframe
                                                class="w-full"
                                                loading="lazy"
                                                style="height:520px"
                                                :src="lesson.video_url"
                                                allowfullscreen
                                        ></iframe>
                                    </template>
                                </div>
                            </template>

                            <!-- FILE -->
                            <template x-if="lesson.type === 'FILE' && lesson.file_url">
                                <div class="rounded-2xl border border-be-ink-100 p-4 bg-be-ink-50/40">
                                    <div class="flex items-start justify-between gap-3">
                                        <div class="min-w-0">
                                            <div class="text-sm font-extrabold text-slate-900">Ressource</div>
                                            <div class="text-xs text-be-ink-500 mt-1">
                                                Ouvre le document. Tu peux ensuite marquer terminé.
                                            </div>
                                        </div>
                                        <a
                                                class="inline-flex items-center gap-2 px-4 py-2 rounded-xl bg-white border border-be-ink-100 hover:bg-be-ink-50 text-sm font-semibold active:scale-[.98] transition"
                                                :href="lesson.file_url"
                                                target="_blank"
                                                rel="noopener"
                                                @click="onFileOpened()"
                                        >
                                            <i class="fa-solid fa-file-arrow-down"></i> Ouvrir
                                        </a>
                                    </div>
                                </div>
                            </template>

                            <!-- TEXT -->
                            <template x-if="lesson.type === 'TEXT'">
                                <div class="rounded-2xl border border-be-ink-100 p-5">
                                    <div class="prose max-w-none">
                                        <div x-html="lesson.content || '<p>Contenu vide.</p>'"></div>
                                    </div>

                                    <div class="mt-8 pt-6 border-t border-be-ink-100">
                                        <div class="text-xs text-be-ink-500">
                                            Astuce: en arrivant en bas, la leçon se marque comme terminée
                                            automatiquement.
                                        </div>
                                        <div x-ref="textEndSentinel" class="h-1 w-full"></div>
                                    </div>
                                </div>
                            </template>

                            <!-- QUIZ -->
                            <template x-if="lesson.type === 'QUIZ'">
                                <div class="space-y-4">

                                    <!-- Chargement -->
                                    <template x-if="quiz.loading">
                                        <div class="rounded-2xl border border-be-ink-100 p-6 text-center text-sm text-be-ink-500">
                                            <div class="inline-block w-5 h-5 border-2 border-be-sky-300 border-t-be-sky-600 rounded-full animate-spin mb-2"></div>
                                            <div>Chargement du quiz…</div>
                                        </div>
                                    </template>

                                    <!-- Erreur chargement -->
                                    <template x-if="!quiz.loading && quiz.error && !quiz.loaded">
                                        <div class="rounded-2xl border border-red-100 bg-red-50 p-5 text-sm text-red-700" x-text="quiz.error"></div>
                                    </template>

                                    <!-- Quiz chargé — déjà soumis (résultat) -->
                                    <template x-if="quiz.loaded && quiz.result">
                                        <div>
                                            <!-- Résultat -->
                                            <div :class="quiz.result.passed
                                                    ? 'border-emerald-100 bg-emerald-50'
                                                    : 'border-amber-100 bg-amber-50'"
                                                 class="rounded-2xl border p-5">
                                                <div class="flex items-center gap-3">
                                                    <div :class="quiz.result.passed ? 'bg-emerald-100 text-emerald-700' : 'bg-amber-100 text-amber-700'"
                                                         class="w-10 h-10 rounded-xl flex items-center justify-center text-lg">
                                                        <template x-if="quiz.result.passed"><i class="fas fa-circle-check"></i></template>
                                                        <template x-if="!quiz.result.passed"><i class="fas fa-rotate-right"></i></template>
                                                    </div>
                                                    <div>
                                                        <div :class="quiz.result.passed ? 'text-emerald-900' : 'text-amber-900'"
                                                             class="font-semibold text-sm"
                                                             x-text="quiz.result.passed ? '🎉 Bravo, tu as réussi !' : 'Continue à t\'entraîner'"></div>
                                                        <div class="text-xs mt-0.5"
                                                             :class="quiz.result.passed ? 'text-emerald-700' : 'text-amber-700'">
                                                            Score : <span class="font-bold" x-text="quiz.result.score_percent + '%'"></span>
                                                            · Score requis : <span x-text="quiz.result.passing_score + '%'"></span>
                                                            · <span x-text="quiz.result.good_answers + '/' + quiz.result.total_questions"></span> bonne(s) réponse(s)
                                                        </div>
                                                    </div>
                                                </div>
                                            </div>

                                            <!-- Réessayer si tentatives restantes -->
                                            <template x-if="!quiz.result.passed && quiz.data && quiz.attemptsLeft > 0">
                                                <button @click="resetQuiz()"
                                                        class="mt-3 w-full py-2.5 rounded-xl border border-be-ink-100 bg-white hover:bg-be-ink-50 text-sm font-semibold">
                                                    Réessayer
                                                    (<span x-text="quiz.attemptsLeft"></span> tentative<span x-show="quiz.attemptsLeft > 1">s</span> restante<span x-show="quiz.attemptsLeft > 1">s</span>)
                                                </button>
                                            </template>
                                        </div>
                                    </template>

                                    <!-- Quiz chargé — formulaire de réponses -->
                                    <template x-if="quiz.loaded && !quiz.result && quiz.data">
                                        <div class="space-y-4">
                                            <!-- En-tête quiz -->
                                            <div class="rounded-2xl border border-be-sky-100 bg-be-sky-50 px-5 py-4 flex items-center justify-between gap-3">
                                                <div>
                                                    <div class="text-sm font-extrabold text-be-sky-900" x-text="quiz.data.title"></div>
                                                    <div class="text-xs text-be-sky-700 mt-0.5">
                                                        Score requis : <span class="font-semibold" x-text="quiz.data.passing_score + '%'"></span>
                                                        · Max tentatives : <span class="font-semibold" x-text="quiz.data.max_attempts"></span>
                                                        · Tentatives effectuées : <span class="font-semibold" x-text="quiz.data.attempts_count"></span>
                                                    </div>
                                                </div>
                                                <i class="fas fa-clipboard-question text-be-sky-400 text-xl"></i>
                                            </div>

                                            <!-- Questions -->
                                            <template x-for="(q, qi) in (quiz.data.questions || [])" :key="q.id">
                                                <div class="rounded-2xl border border-be-ink-100 bg-white p-5">
                                                    <div class="text-sm font-semibold text-slate-900 mb-3"
                                                         x-text="(qi + 1) + '. ' + q.prompt"></div>
                                                    <div class="space-y-2">
                                                        <template x-for="c in (q.choices || [])" :key="c.id">
                                                            <label :class="quiz.answers[q.id] == c.id
                                                                        ? 'border-be-sky-400 bg-be-sky-50 text-be-sky-800'
                                                                        : 'border-be-ink-100 bg-white text-be-ink-700 hover:border-be-ink-200 hover:bg-be-ink-50'"
                                                                   class="flex items-center gap-3 rounded-xl border px-4 py-3 cursor-pointer transition">
                                                                <input type="radio"
                                                                       :name="'q_' + q.id"
                                                                       :value="c.id"
                                                                       :checked="quiz.answers[q.id] == c.id"
                                                                       @change="quiz.answers[q.id] = c.id"
                                                                       class="accent-be-sky-600 flex-shrink-0">
                                                                <span class="text-sm" x-text="c.text"></span>
                                                            </label>
                                                        </template>
                                                    </div>
                                                </div>
                                            </template>

                                            <!-- Erreur soumission -->
                                            <template x-if="quiz.error">
                                                <div class="rounded-xl border border-red-100 bg-red-50 px-4 py-3 text-sm text-red-700"
                                                     x-text="quiz.error"></div>
                                            </template>

                                            <!-- Bouton soumettre -->
                                            <button @click="submitQuiz()"
                                                    :disabled="quiz.submitting || !quizAllAnswered()"
                                                    class="w-full py-3 rounded-2xl bg-gradient-to-r from-be-sky-600 to-be-sky-500 text-white font-semibold shadow-soft hover:brightness-[1.02] transition disabled:opacity-50 flex items-center justify-center gap-2">
                                                <span x-show="quiz.submitting"
                                                      class="w-4 h-4 border-2 border-white/40 border-t-white rounded-full animate-spin"></span>
                                                <i x-show="!quiz.submitting" class="fas fa-paper-plane"></i>
                                                <span x-text="quiz.submitting ? 'Envoi…' : 'Soumettre mes réponses'"></span>
                                            </button>
                                            <p class="text-[11px] text-be-ink-400 text-center"
                                               x-show="!quizAllAnswered()">
                                                Réponds à toutes les questions avant de soumettre.
                                            </p>
                                        </div>
                                    </template>

                                    <!-- Max tentatives atteint, pas encore de résultat -->
                                    <template x-if="quiz.loaded && !quiz.result && !quiz.data">
                                        <div class="rounded-2xl border border-amber-100 bg-amber-50 p-5 text-sm text-amber-800">
                                            <i class="fas fa-lock mr-2"></i>
                                            Nombre maximal de tentatives atteint pour ce quiz.
                                        </div>
                                    </template>
                                </div>
                            </template>

                            <!-- LIVE -->
                            <template x-if="lesson.type === 'LIVE'">
                                <div class="rounded-2xl border border-be-ink-100 p-5 bg-be-ink-50/40">
                                    <div class="text-sm font-extrabold text-slate-900">Session Live</div>
                                    <div class="text-xs text-be-ink-500 mt-1">
                                        Ajoute l’URL de la session live / calendrier.
                                    </div>
                                </div>
                            </template>

                            <!-- Empty state -->
                            <template x-if="!lesson.type">
                                <div class="rounded-2xl border border-be-ink-100 p-8 text-center text-be-ink-500">
                                    Aucune leçon disponible.
                                </div>
                            </template>

                            <!-- Lesson progress -->
                            <div class="rounded-2xl border border-be-ink-100 p-4">
                                <div class="flex items-center justify-between gap-3">
                                    <div class="min-w-0">
                                        <div class="text-xs font-extrabold text-slate-900">Progression de cette leçon
                                        </div>
                                        <div class="text-xs text-be-ink-500 mt-1">
                                            Mise à jour auto (vidéo mp4 / lecture texte). Sinon ajuste manuellement.
                                        </div>
                                    </div>
                                    <div class="text-sm font-extrabold text-slate-900"
                                         x-text="(lessonProgress.percent || 0) + '%'"></div>
                                </div>

                                <div class="mt-3 h-2 rounded-full bg-be-ink-100 overflow-hidden">
                                    <div
                                            class="h-full rounded-full bg-emerald-500 transition-all duration-300"
                                            :style="`width:${lessonProgress.percent || 0}%`"
                                    ></div>
                                </div>

                                <div class="mt-4 flex items-center gap-2">
                                    <input
                                            type="range"
                                            min="0"
                                            max="100"
                                            x-model.number="lessonProgress.percent"
                                            class="w-full"
                                    >
                                    <button
                                            class="px-3 py-2 rounded-xl bg-be-sky-600 text-white text-sm font-semibold hover:opacity-90 active:scale-[.98] transition"
                                            @click="saveProgress(false, { force: true, toast: true })"
                                            :disabled="saving.lesson"
                                            :class="saving.lesson ? 'opacity-60 cursor-not-allowed' : ''"
                                            type="button"
                                    >
                                        <span x-show="!saving.lesson">Enregistrer</span>
                                        <span x-show="saving.lesson">Sync…</span>
                                    </button>
                                </div>

                                <div class="mt-2 text-[11px] text-be-ink-500">
                                    <span x-show="saving.lesson">Enregistrement…</span>
                                    <span x-show="!saving.lesson && lastSavedAt">
                                    Dernière sauvegarde: <span x-text="lastSavedAt"></span>
                                </span>
                                </div>
                            </div>
                        </div>
                    </template>
                </div>
            </section>
        </div>
    </div>

    <script>
        function coursePlayerUdemy() {
            let cfg = {
                courseId: null,
                api: {
                    outline: "",
                    continue: "",
                    lessonStateBase: "",
                    lessonProgressBase: "",
                    setCurrent: ""
                }
            };

            try {
                cfg = JSON.parse(document.getElementById("player-config")?.textContent || "{}");
            } catch (e) {
                console.error("Invalid player-config JSON", e);
            }

            return {
                courseId: cfg.courseId,
                api: cfg.api || {},

                loading: {outline: true, lesson: true},
                saving: {any: false, lesson: false},

                course: {id: null, title: ""},
                sections: [],
                progress: {percent: 0, completed_lessons: 0, total_lessons: 0},

                currentLessonId: null,
                lesson: {
                    id: null,
                    title: "",
                    type: "",
                    video_url: null,
                    file_url: null,
                    content: null,
                    duration_sec: null
                },
                lessonProgress: {
                    percent: 0,
                    is_completed: false,
                    last_position_seconds: 0
                },

                nav: {prevId: null, nextId: null},
                lastSavedAt: "",
                ui: {
                    sidebarOpen: false,
                    search: "",
                    openSections: {},
                    isDesktop: false,
                    toast: {show: false, msg: "", type: "ok", t: null}
                },

                // ── État quiz ──────────────────────────────────────────────────
                quiz: {
                    loading:     false,
                    loaded:      false,
                    data:        null,   // { id, title, passing_score, max_attempts, attempts_count, questions }
                    answers:     {},     // { question_id: choice_id }
                    submitting:  false,
                    result:      null,   // { score_percent, passed, passing_score, good_answers, total_questions }
                    error:       null,
                    attemptsLeft: 0,
                },
                // ──────────────────────────────────────────────────────────────

                _outlineRefreshTimer: null,
                _videoSeekDone: false,
                _textObserver: null,
                _saveCount: 0,
                _prefetchCache: new Map(),
                _saveAbort: null,
                _saveDebounceTimer: null,
                _videoTickLastSentAt: 0,
                lastSentPercent: -1,
                lastSentSecond: -1,

                formatDuration(sec) {
                    const n = Number(sec || 0);
                    if (!n || n < 0) return "—";
                    const m = Math.floor(n / 60);
                    const s = Math.floor(n % 60);
                    if (m <= 0) return `${s}s`;
                    return `${m}m ${String(s).padStart(2, "0")}s`;
                },

                isMp4(url) {
                    const u = String(url || "").toLowerCase();
                    return u.includes(".mp4") || u.includes("video/mp4") || u.includes("content-type=video");
                },

                nowTime() {
                    const d = new Date();
                    return d.toLocaleTimeString("fr-FR", {
                        hour: "2-digit",
                        minute: "2-digit"
                    });
                },

                toast(msg, type = "ok") {
                    try {
                        clearTimeout(this.ui.toast.t);
                        this.ui.toast.msg = msg || "";
                        this.ui.toast.type = type || "ok";
                        this.ui.toast.show = true;
                        this.ui.toast.t = setTimeout(() => {
                            this.ui.toast.show = false;
                        }, 1800);
                    } catch (e) {
                        console.warn("toast error", e);
                    }
                },

                async apiGet(url) {
                    if (!url) throw new Error("Missing GET URL");
                    const res = await fetch(url, {
                        headers: {"Accept": "application/json"},
                        credentials: "same-origin"
                    });
                    if (!res.ok) throw new Error(`GET ${url} -> ${res.status}`);
                    return await res.json();
                },

                getCsrf() {
                    const m = document.cookie.match(/csrftoken=([^;]+)/);
                    return m ? m[1] : "";
                },

                async apiPost(url, payload = {}, signal = null) {
                    if (!url) throw new Error("Missing POST URL");

                    const res = await fetch(url, {
                        method: "POST",
                        headers: {
                            "Content-Type": "application/json",
                            "X-CSRFToken": this.getCsrf(),
                            "Accept": "application/json"
                        },
                        body: JSON.stringify(payload || {}),
                        credentials: "same-origin",
                        signal
                    });

                    if (!res.ok) {
                        let d = "";
                        try {
                            d = JSON.stringify(await res.json());
                        } catch (e) {
                        }
                        throw new Error(`POST ${url} -> ${res.status} ${d}`);
                    }
                    return await res.json();
                },

                async init() {
                    try {
                        const mq = window.matchMedia("(min-width: 1024px)");
                        const updateDesktop = () => {
                            this.ui.isDesktop = mq.matches;
                            if (this.ui.isDesktop) this.ui.sidebarOpen = false;
                        };

                        updateDesktop();
                        if (mq.addEventListener) {
                            mq.addEventListener("change", updateDesktop);
                        } else if (mq.addListener) {
                            mq.addListener(updateDesktop);
                        }

                        await this.loadOutline();
                        await this.resolveContinueLesson();

                        if (this.currentLessonId) {
                            await this.loadLesson(this.currentLessonId);
                            this.computeNav();
                            this.prefetchAround();
                        } else {
                            this.loading.lesson = false;
                        }

                        this.startAutoRefreshOutline();

                        if (!this.ui.isDesktop) {
                            this.ui.sidebarOpen = false;
                        }
                    } catch (e) {
                        console.error("init error", e);
                        this.loading.outline = false;
                        this.loading.lesson = false;
                        this.toast("Erreur de chargement du lecteur", "warn");
                    }
                },

                startAutoRefreshOutline() {
                    try {
                        clearInterval(this._outlineRefreshTimer);
                        this._outlineRefreshTimer = setInterval(() => {
                            this.refreshOutline(false).catch(() => {
                            });
                        }, 30000);
                    } catch (e) {
                        console.warn("auto refresh error", e);
                    }
                },

                async loadOutline() {
                    try {
                        this.loading.outline = true;
                        const data = await this.apiGet(this.api.outline);

                        this.course = data?.course || this.course;
                        this.sections = (data?.sections || []).map(s => ({
                            ...s,
                            lessons: (s.lessons || []).map(l => ({
                                id: l.id,
                                title: l.title || "",
                                type: l.lesson_type || l.type || "",
                                duration_sec: l.duration_sec ?? null,
                                percent: Number(l.progress_percent ?? l.percent ?? 0),
                                is_completed: !!(l.completed ?? l.is_completed),
                                is_preview: !!l.is_preview
                            }))
                        }));

                        this.progress = {
                            percent: Number(data?.progress?.percent ?? 0),
                            completed_lessons: Number(data?.progress?.completed_lessons ?? 0),
                            total_lessons: Number(data?.progress?.total_lessons ?? 0)
                        };

                        this.currentLessonId = data?.current_lesson_id || this.currentLessonId;

                        if (!Object.keys(this.ui.openSections).length && this.sections.length) {
                            this.ui.openSections[this.sections[0].id] = true;
                        }
                    } catch (e) {
                        console.error("loadOutline error", e);
                        this.toast("Impossible de charger le plan", "warn");
                    } finally {
                        this.loading.outline = false;
                    }
                },

                async refreshOutline(showToast = false) {
                    if (this.loading.outline) return;
                    await this.loadOutline();
                    this.computeNav();
                    if (showToast) this.toast("Plan mis à jour", "ok");
                },

                async resolveContinueLesson() {
                    try {
                        if (this.currentLessonId) return;
                        const data = await this.apiGet(this.api.continue);
                        this.currentLessonId = data?.lesson_id || null;
                    } catch (e) {
                        console.error("resolveContinueLesson error", e);
                    }
                },

                filteredSections() {
                    const q = String(this.ui.search || "").trim().toLowerCase();
                    if (!q) return this.sections || [];

                    return (this.sections || [])
                        .map(s => {
                            const lessons = (s.lessons || []).filter(l => {
                                return String(l.title || "").toLowerCase().includes(q)
                                    || String(l.type || "").toLowerCase().includes(q);
                            });
                            return lessons.length ? {...s, lessons} : null;
                        })
                        .filter(Boolean);
                },

                toggleSection(sectionId) {
                    this.ui.openSections[sectionId] = !this.ui.openSections[sectionId];
                },

                // ── Quiz helpers ───────────────────────────────────────────────
                /** Trouve le section_id de la leçon courante en parcourant le plan. */
                findSectionIdForLesson(lessonId) {
                    for (const s of (this.sections || [])) {
                        for (const l of (s.lessons || [])) {
                            if (Number(l.id) === Number(lessonId)) return s.id;
                        }
                    }
                    return null;
                },

                /** Charge le quiz de la section contenant la leçon courante. */
                async loadQuiz() {
                    this.quiz = {
                        loading: true, loaded: false, data: null,
                        answers: {}, submitting: false, result: null, error: null, attemptsLeft: 0
                    };
                    const sectionId = this.findSectionIdForLesson(this.currentLessonId);
                    if (!sectionId) {
                        this.quiz.loading = false;
                        this.quiz.loaded  = true;
                        this.quiz.error   = "Section introuvable pour ce quiz.";
                        return;
                    }
                    try {
                        const url = `/api/learner/courses/${this.courseId}/sections/${sectionId}/quiz/`;
                        const data = await this.apiGet(url);
                        this.quiz.data         = data;
                        this.quiz.attemptsLeft = Math.max(0, (data.max_attempts || 0) - (data.attempts_count || 0));
                        this.quiz.loaded       = true;
                    } catch (e) {
                        this.quiz.error  = e?.detail || "Impossible de charger le quiz.";
                        this.quiz.loaded = true;
                    } finally {
                        this.quiz.loading = false;
                    }
                },

                /** Vérifie que toutes les questions ont une réponse. */
                quizAllAnswered() {
                    if (!this.quiz.data?.questions?.length) return false;
                    return this.quiz.data.questions.every(q => this.quiz.answers[q.id] != null);
                },

                /** Soumet les réponses du quiz. */
                async submitQuiz() {
                    if (!this.quizAllAnswered()) return;
                    this.quiz.submitting = true;
                    this.quiz.error      = null;
                    const sectionId = this.findSectionIdForLesson(this.currentLessonId);
                    try {
                        const answers = Object.entries(this.quiz.answers).map(([qid, cid]) => ({
                            question_id: Number(qid),
                            choice_id:   Number(cid),
                        }));
                        const url    = `/api/learner/courses/${this.courseId}/sections/${sectionId}/quiz/submit/`;
                        const result = await this.apiPost(url, { answers });
                        this.quiz.result       = result;
                        this.quiz.attemptsLeft = Math.max(0, this.quiz.attemptsLeft - 1);
                        // Rafraîchir la progression globale si le quiz est réussi
                        if (result?.passed) {
                            this.$nextTick(() => this.refreshOutlineSilently());
                        }
                    } catch (e) {
                        this.quiz.error = e?.detail || e?.message || "Erreur lors de la soumission.";
                    } finally {
                        this.quiz.submitting = false;
                    }
                },

                /** Permet de réessayer le quiz (recharge pour avoir le bon attempts_count). */
                async resetQuiz() {
                    await this.loadQuiz();
                },

                /** Rafraîchit silencieusement le plan de cours (progression). */
                async refreshOutlineSilently() {
                    try {
                        const data = await this.apiGet(this.api.outline);
                        this.progress = {
                            percent: Number(data?.progress?.percent ?? 0),
                            completed_lessons: Number(data?.progress?.completed_lessons ?? 0),
                            total_lessons: Number(data?.progress?.total_lessons ?? 0)
                        };
                        // Mettre à jour l'état is_completed dans la sidebar
                        (data?.sections || []).forEach(s => {
                            const sec = this.sections.find(x => x.id === s.id);
                            if (!sec) return;
                            (s.lessons || []).forEach(l => {
                                const lesson = sec.lessons.find(x => x.id === l.id);
                                if (lesson) {
                                    lesson.is_completed   = !!(l.completed ?? l.is_completed);
                                    lesson.percent        = Number(l.progress_percent ?? l.percent ?? 0);
                                }
                            });
                        });
                    } catch (_) { /* silencieux */ }
                },
                // ──────────────────────────────────────────────────────────────

                expandAll(open) {
                    (this.sections || []).forEach(s => {
                        this.ui.openSections[s.id] = !!open;
                    });
                },

                countCompleted(section) {
                    return (section?.lessons || []).filter(l => l.is_completed).length;
                },

                flattenLessons() {
                    const out = [];
                    (this.sections || []).forEach(s => {
                        (s.lessons || []).forEach(l => out.push(l));
                    });
                    return out;
                },

                computeNav() {
                    const list = this.flattenLessons();
                    const idx = list.findIndex(x => Number(x.id) === Number(this.currentLessonId));
                    this.nav.prevId = idx > 0 ? list[idx - 1].id : null;
                    this.nav.nextId = (idx >= 0 && idx < list.length - 1) ? list[idx + 1].id : null;
                },

                async prevLesson() {
                    if (this.nav.prevId) await this.openLesson(this.nav.prevId);
                },

                async nextLesson() {
                    if (this.nav.nextId) await this.openLesson(this.nav.nextId);
                },

                async openLesson(lessonId) {
                    if (!lessonId) return;
                    if (Number(lessonId) === Number(this.currentLessonId) && !this.loading.lesson) return;

                    this.currentLessonId = lessonId;
                    this.computeNav();

                    if (!this.ui.isDesktop) {
                        this.ui.sidebarOpen = false;
                    }

                    try {
                        await this.apiPost(this.api.setCurrent, {lesson_id: lessonId});
                    } catch (e) {
                        console.warn("setCurrent error", e);
                    }

                    await this.loadLesson(lessonId);
                    this.prefetchAround();
                },

                normalizeLessonState(data) {
                    const raw = data?.lesson || {};
                    const type = raw.type || raw.lesson_type || raw.lessonType || "";

                    return {
                        lesson: {
                            ...raw,
                            id: raw.id || null,
                            title: raw.title || "",
                            type,
                            video_url: raw.video_url || raw.videoUrl || raw.video || null,
                            file_url: raw.file_url || raw.fileUrl || raw.file || null,
                            content: raw.content || raw.text || raw.html || null,
                            duration_sec: raw.duration_sec ?? raw.duration ?? null
                        },
                        progress: {
                            percent: Number(data?.progress?.percent ?? data?.progress?.progress_percent ?? 0),
                            is_completed: !!(data?.progress?.is_completed ?? data?.progress?.completed),
                            last_position_seconds: Number(data?.progress?.last_position_seconds ?? 0)
                        }
                    };
                },

                async loadLesson(lessonId) {
                    try {
                        this.loading.lesson = true;
                        this._videoSeekDone = false;
                        this.teardownTextObserver();

                        const key = Number(lessonId);

                        if (this._prefetchCache.has(key)) {
                            const cached = this._prefetchCache.get(key);
                            this.lesson = cached.lesson || this.lesson;
                            this.lessonProgress = cached.progress || this.lessonProgress;
                            this.applyOptimisticToSidebar(lessonId, this.lessonProgress);

                            this.$nextTick(() => {
                                if (this.lesson.type === "TEXT") this.setupTextAutoComplete();
                                if (this.lesson.type === "VIDEO") this.seekVideoIfPossible();
                                if (this.lesson.type === "QUIZ")  this.loadQuiz();
                            });
                            return;
                        }

                        const url = `${this.api.lessonStateBase}${lessonId}/state/`;
                        const data = await this.apiGet(url);
                        const normalized = this.normalizeLessonState(data);

                        this.lesson = normalized.lesson;
                        this.lessonProgress = normalized.progress;
                        this.applyOptimisticToSidebar(lessonId, this.lessonProgress);

                        this.$nextTick(() => {
                            if (this.lesson.type === "TEXT") this.setupTextAutoComplete();
                            if (this.lesson.type === "VIDEO") this.seekVideoIfPossible();
                            if (this.lesson.type === "QUIZ")  this.loadQuiz();
                        });
                    } catch (e) {
                        console.error("loadLesson error", e);
                        this.lesson = {
                            id: null,
                            title: "Erreur de chargement",
                            type: "",
                            video_url: null,
                            file_url: null,
                            content: "<p>Impossible de charger cette leçon.</p>",
                            duration_sec: null
                        };
                        this.lessonProgress = {
                            percent: 0,
                            is_completed: false,
                            last_position_seconds: 0
                        };
                        this.toast("Impossible de charger la leçon", "warn");
                    } finally {
                        this.loading.lesson = false;
                    }
                },

                prefetchAround() {
                    [this.nav.prevId, this.nav.nextId].filter(Boolean).forEach(id => this.prefetchLesson(id));
                },

                async prefetchLesson(lessonId) {
                    const key = Number(lessonId);
                    if (!key || this._prefetchCache.has(key)) return;

                    try {
                        const url = `${this.api.lessonStateBase}${lessonId}/state/`;
                        const data = await this.apiGet(url);
                        const normalized = this.normalizeLessonState(data);
                        this._prefetchCache.set(key, normalized);

                        if (this._prefetchCache.size > 6) {
                            const firstKey = this._prefetchCache.keys().next().value;
                            this._prefetchCache.delete(firstKey);
                        }
                    } catch (e) {
                        console.warn("prefetchLesson error", e);
                    }
                },

                applyOptimisticToSidebar(lessonId, prog) {
                    (this.sections || []).forEach(s => {
                        (s.lessons || []).forEach(l => {
                            if (Number(l.id) === Number(lessonId)) {
                                l.percent = Number(prog?.percent ?? l.percent ?? 0);
                                l.is_completed = !!(prog?.is_completed ?? l.is_completed);
                            }
                        });
                    });
                },

                scheduleSave(markDone = false, opts = {}) {
                    clearTimeout(this._saveDebounceTimer);
                    this._saveDebounceTimer = setTimeout(() => {
                        this.saveProgress(markDone, opts).catch(() => {
                        });
                    }, opts.delayMs || 450);
                },

                async saveProgress(markDone = false, opts = {}) {
                    const force = !!opts.force;
                    const wantToast = !!opts.toast;

                    if (!this.currentLessonId) return;

                    const percent = Math.max(0, Math.min(100, Number(this.lessonProgress.percent || 0)));
                    const seconds = Math.max(0, Number(this.lessonProgress.last_position_seconds || 0));
                    const is_completed = !!markDone || !!this.lessonProgress.is_completed;

                    const percentDelta = Math.abs(percent - (this.lastSentPercent < 0 ? percent : this.lastSentPercent));
                    const secondsDelta = Math.abs(seconds - (this.lastSentSecond < 0 ? seconds : this.lastSentSecond));

                    if (!force && !markDone && percentDelta < 2 && secondsDelta < 10) {
                        return;
                    }

                    try {
                        this._saveAbort?.abort();
                    } catch (e) {
                    }

                    this._saveAbort = new AbortController();
                    this.saving.lesson = true;
                    this.saving.any = true;

                    try {
                        const url = `${this.api.lessonProgressBase}${this.currentLessonId}/progress/`;
                        const payload = {
                            percent,
                            last_position_seconds: seconds,
                            is_completed
                        };

                        this.lessonProgress.percent = percent;
                        this.lessonProgress.is_completed = is_completed;
                        this.applyOptimisticToSidebar(this.currentLessonId, this.lessonProgress);

                        const data = await this.apiPost(url, payload, this._saveAbort.signal);

                        if (data?.progress) {
                            this.lessonProgress.percent = Number(data.progress.percent ?? this.lessonProgress.percent);
                            this.lessonProgress.is_completed = !!(data.progress.is_completed ?? this.lessonProgress.is_completed);
                            this.lessonProgress.last_position_seconds = Number(data.progress.last_position_seconds ?? this.lessonProgress.last_position_seconds);
                            this.applyOptimisticToSidebar(this.currentLessonId, this.lessonProgress);
                        }

                        this.lastSentPercent = this.lessonProgress.percent;
                        this.lastSentSecond = this.lessonProgress.last_position_seconds;
                        this.lastSavedAt = this.nowTime();

                        this._saveCount += 1;
                        if (this.lessonProgress.is_completed || this._saveCount % 4 === 0) {
                            await this.refreshOutline(false);
                        }

                        if (wantToast) {
                            this.toast("Progress enregistré", "ok");
                        }
                    } catch (e) {
                        if (e.name !== "AbortError") {
                            console.error("saveProgress error", e);
                            this.toast("Erreur de synchronisation", "warn");
                        }
                    } finally {
                        this.saving.lesson = false;
                        this.saving.any = false;
                    }
                },

                async toggleCompleted() {
                    if (this.loading.lesson) return;

                    if (this.lessonProgress.is_completed) {
                        this.lessonProgress.is_completed = false;
                        await this.saveProgress(false, {force: true, toast: true});
                        return;
                    }

                    this.lessonProgress.percent = 100;
                    this.lessonProgress.is_completed = true;
                    await this.saveProgress(true, {force: true, toast: true});
                },

                onVideoLoaded() {
                    this.seekVideoIfPossible();
                },

                seekVideoIfPossible() {
                    const v = this.$refs.videoEl;
                    if (!v || this._videoSeekDone) return;

                    const pos = Number(this.lessonProgress.last_position_seconds || 0);
                    if (pos > 2 && isFinite(pos)) {
                        try {
                            v.currentTime = pos;
                        } catch (e) {
                            console.warn("seek error", e);
                        }
                    }
                    this._videoSeekDone = true;
                },

                onVideoTimeUpdate() {
                    const v = this.$refs.videoEl;
                    if (!v || !isFinite(v.duration) || !v.duration) return;

                    const now = Date.now();
                    const current = Math.floor(v.currentTime || 0);
                    const duration = Math.floor(v.duration || 0);
                    const percent = duration ? Math.floor((current / duration) * 100) : 0;

                    this.lessonProgress.last_position_seconds = current;
                    this.lessonProgress.percent = Math.min(99, Math.max(Number(this.lessonProgress.percent || 0), percent));

                    if (now - this._videoTickLastSentAt > 2500) {
                        this._videoTickLastSentAt = now;
                        this.scheduleSave(false, {force: false, delayMs: 400});
                    }
                },

                async onVideoEnded() {
                    this.lessonProgress.percent = 100;
                    this.lessonProgress.is_completed = true;
                    await this.saveProgress(true, {force: true, toast: true});
                },

                setupTextAutoComplete() {
                    if (this.lessonProgress.is_completed) return;

                    const sentinel = this.$refs.textEndSentinel;
                    const root = this.$refs.playerScroll;
                    if (!sentinel || !root) return;

                    this._textObserver = new IntersectionObserver(async (entries) => {
                        const hit = entries.some(e => e.isIntersecting);
                        if (!hit) return;

                        this.lessonProgress.percent = 100;
                        this.lessonProgress.is_completed = true;
                        await this.saveProgress(true, {force: true, toast: true});
                        this.teardownTextObserver();
                    }, {
                        root,
                        threshold: 0.6
                    });

                    this._textObserver.observe(sentinel);
                },

                teardownTextObserver() {
                    if (this._textObserver) {
                        try {
                            this._textObserver.disconnect();
                        } catch (e) {
                        }
                        this._textObserver = null;
                    }
                },

                onFileOpened() {
                    if (this.lessonProgress.is_completed) return;
                    this.lessonProgress.percent = Math.max(Number(this.lessonProgress.percent || 0), 30);
                    this.scheduleSave(false, {force: false, delayMs: 400});
                    this.toast("Ressource ouverte", "sync");
                }
            };
        }
    </script>
