{% comment %}
  partials/lesson_player.html — Player vidéo sécurisé (V5.D / SEC-33).

  Avant : ``<video :src="lesson.video_url" controls>`` exposait l'URL MinIO
  brute dans le DOM → téléchargement trivial des cours payants.

  Après :
  - on charge l'URL signée (60s) côté JS via fetch sur
    ``/learn/api/lessons/<id>/stream/`` ;
  - ``controlsList="nodownload noremoteplayback"`` empêche les options
    natives du menu contextuel ;
  - le clic-droit est intercepté via Alpine pour limiter les téléchargements ;
  - ``disablePictureInPicture`` empêche le PiP ;
  - on rafraîchit l'URL automatiquement avant expiration (50s) si la
    lecture continue.

  Variables requises :
    - lesson_id : ID de la Lesson Django (entier).
    - poster_url : optionnelle, URL d'image de fallback.
    - title : optionnel, pour aria-label.

  Usage côté template parent :
      {% include "partials/lesson_player.html" with lesson_id=lesson.id poster_url=lesson.thumbnail_url title=lesson.title %}
{% endcomment %}

<div x-data="lessonPlayer({{ lesson_id }})"
     x-init="loadStream()"
     class="rounded-2xl overflow-hidden bg-slate-950 aspect-video relative">

  {# Skeleton tant qu'on n'a pas l'URL. #}
  <div x-show="loading"
       class="absolute inset-0 flex items-center justify-center text-slate-400"
       aria-live="polite" role="status">
    <i class="fas fa-circle-notch fa-spin text-2xl mr-2" aria-hidden="true"></i>
    <span>Chargement de la vidéo…</span>
  </div>

  {# Erreur (réseau, droits, expiration). #}
  <div x-show="error"
       x-cloak
       class="absolute inset-0 flex flex-col items-center justify-center text-center p-6 text-rose-100 bg-rose-950/70"
       role="alert" aria-live="assertive">
    <i class="fas fa-triangle-exclamation text-3xl mb-3" aria-hidden="true"></i>
    <p x-text="error"></p>
    <button type="button"
            @click="loadStream()"
            class="mt-4 px-4 py-2 rounded-lg bg-rose-700 text-white text-sm font-semibold hover:bg-rose-600 focus:outline-none focus:ring-2 focus:ring-rose-300">
      Réessayer
    </button>
  </div>

  {# Vidéo MP4 / HLS protégée. #}
  <template x-if="!loading && !error && kind === 'mp4'">
    <video x-ref="video"
           :src="url"
           {% if poster_url %}poster="{{ poster_url }}"{% endif %}
           controls
           controlsList="nodownload noremoteplayback noplaybackrate"
           disablePictureInPicture
           preload="metadata"
           crossorigin="anonymous"
           aria-label="Lecteur vidéo {{ title|default:'leçon' }}"
           @contextmenu="onContextMenu($event)"
           @error="onMediaError($event)"
           @timeupdate="onTimeUpdate($event)"
           class="w-full h-full bg-black"></video>
  </template>

  {# Fallback iframe (YouTube/Vimeo). NB : pas de signed URL possible.
     On documente côté audit (UX-35) que le track de progression n'est
     pas disponible pour ces sources. #}
  <template x-if="!loading && !error && kind === 'external'">
    <iframe x-ref="iframe"
            :src="url"
            class="absolute inset-0 w-full h-full"
            allowfullscreen
            sandbox="allow-same-origin allow-scripts allow-presentation"
            referrerpolicy="strict-origin-when-cross-origin"
            title="{{ title|default:'Vidéo externe' }}"></iframe>
  </template>
</div>

{% load static %}
<script src="{% static 'src/js/lesson-player.js' %}"></script>
