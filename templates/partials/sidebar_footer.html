<div class="pt-4 border-t accent-border">
  <div class="flex items-center gap-3 px-2">
    <div class="w-10 h-10 rounded-xl accent-grad-bg flex items-center justify-center
                text-white font-bold text-sm shrink-0" aria-hidden="true">
      {{ request.user.full_name|slice:":1"|default:"U"|upper }}
    </div>
    <div class="min-w-0 flex-1" x-show="isExpanded" x-transition x-cloak>
      <div class="text-sm font-semibold truncate">
        {{ request.user.full_name|default:request.user.email|truncatechars:24 }}
      </div>
      <div class="text-[11px] text-be-ink-500 dark:text-white/50">{{ role_label }}</div>
    </div>
  </div>

  <div class="mt-3 grid grid-cols-2 gap-2" x-show="isExpanded" x-transition x-cloak>
    <a href="{% url 'compte:profile' %}"
       @click="closeMobile()"
       class="px-3 py-2.5 rounded-xl border border-be-ink-100 dark:border-white/10
              bg-white dark:bg-white/5 hover:bg-be-ink-50 dark:hover:bg-white/10
              focus-visible:outline-none focus-visible:ring-4 focus-visible:ring-be-sky-200/60
              transition text-xs font-semibold text-center text-be-ink-700 dark:text-white/80">
      Mon profil
    </a>
    <form method="post" action="{% url 'account_logout' %}" class="contents">
      {% csrf_token %}
      <button type="submit"
              class="px-3 py-2.5 rounded-xl accent-bg-strong hover:opacity-90
                     focus-visible:outline-none focus-visible:ring-4 focus-visible:ring-be-sky-200/60
                     transition text-xs font-semibold">
        Déconnexion
      </button>
    </form>
  </div>
</div>
