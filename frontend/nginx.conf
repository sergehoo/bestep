# ═══════════════════════════════════════════════════════════════════
# Best-Épargne — Config nginx SPA + reverse proxy Django (R26)
# ═══════════════════════════════════════════════════════════════════
# Sert le bundle React (/usr/share/nginx/html) et reverse-proxie vers
# le backend Django (`bestweb:8000`) pour :
#   /api/*         → API REST + JWT
#   /admin/super/* → admin Django (superuser) — l'URL /admin/ pure
#                    est en revanche une route SPA React (AdminShell)
#                    qui doit tomber sur le fallback index.html.
#   /media/*       → uploads utilisateur (si servis via Django)
#   /static/*      → assets de l'admin Django
#
# Traefik met déjà le SSL en amont, ce nginx écoute sans privilèges sur :8080.

# ──────────────────────────────────────────────────────────────
# Upstream Django (nom du service docker-compose)
# ──────────────────────────────────────────────────────────────
upstream django_backend {
    server bestweb:8000;
    keepalive 32;
}

# ──────────────────────────────────────────────────────────────
# Content-Security-Policy du SPA
# ──────────────────────────────────────────────────────────────
# Le SPA était servi SANS CSP. La policy de `best_epargne/settings/base.py`
# est posée par `csp.middleware.CSPMiddleware` et ne couvre donc que les
# réponses rendues par Django (/api/, /admin/super/, /static/, /media/) —
# jamais `index.html` ni le bundle React, qui sortent d'ici.
#
# `script-src` est la directive qui compte contre le XSS et elle est
# stricte : pas de 'unsafe-inline', pas de 'unsafe-eval'. Le build Vite le
# permet, `index.html` ne contient qu'un `<script type="module" src=…>` et
# le service worker est servi comme fichier (/registerSW.js, /sw.js).
#
# Les directives de chargement passif (img/media/connect) restent en
# `https:` plutôt qu'une allowlist d'hôtes : le domaine MinIO vient d'une
# variable d'environnement Django (MINIO_PUBLIC_DOMAIN) et ce fichier est
# copié tel quel par le Dockerfile, sans envsubst. Les restreindre
# demanderait de templater la conf au démarrage du conteneur — à faire,
# mais c'est un changement d'infrastructure, pas un correctif de sécurité.
map $host $csp_policy {
    default "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com; img-src 'self' data: blob: https:; media-src 'self' blob: https:; connect-src 'self' https:; frame-src 'self' https://www.youtube.com https://www.youtube-nocookie.com https://player.vimeo.com; worker-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'";
}

# ──────────────────────────────────────────────────────────────
# Compression gzip (nginx apporte gzip_static aussi si assets pré-compressés)
# ──────────────────────────────────────────────────────────────
gzip on;
gzip_vary on;
gzip_min_length 1024;
gzip_proxied any;
gzip_types
    application/javascript
    application/json
    application/xml
    application/xml+rss
    text/css
    text/javascript
    text/plain
    text/xml
    image/svg+xml
    font/ttf
    font/otf
    font/woff
    font/woff2;

# ──────────────────────────────────────────────────────────────
# Server principal
# ──────────────────────────────────────────────────────────────
server {
    listen 8080 default_server;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # ──────────────────────────────────────────────────────────
    # Sécurité — Traefik ajoute HSTS/HTTPS en amont.
    #
    # PIÈGE NGINX, à lire avant de toucher à ce bloc : les directives
    # `add_header` ne sont héritées par un `location` que s'il ne définit
    # AUCUN `add_header` lui-même. Huit locations de ce fichier en
    # définissent un (ne serait-ce que Cache-Control), dont `location /`
    # qui sert `index.html`. Résultat avant ce correctif : le document
    # HTML principal du SPA ne recevait aucun de ces en-têtes.
    #
    # C'est pourquoi le jeu complet est répété dans `location /`. Toute
    # modification ici doit être reportée là-bas.
    # ──────────────────────────────────────────────────────────
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy $csp_policy always;

    # Uploads (10 Mo) — cohérent avec DATA_UPLOAD_MAX_MEMORY_SIZE côté Django.
    client_max_body_size 12M;

    # ──────────────────────────────────────────────────────────
    # Healthcheck local (utilisé par HEALTHCHECK Docker)
    # ──────────────────────────────────────────────────────────
    location = /healthz {
        access_log off;
        return 200 "ok\n";
        default_type text/plain;
    }

    # ──────────────────────────────────────────────────────────
    # 1) Assets statiques SPA — cache long car hashés par Vite
    # ──────────────────────────────────────────────────────────
    location /assets/ {
        access_log off;
        expires 1y;
        add_header Cache-Control "public, immutable" always;
        try_files $uri =404;
    }

    # PWA files — pas de cache long (fichier signé par workbox)
    location = /sw.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        try_files $uri =404;
    }
    location = /manifest.webmanifest {
        add_header Cache-Control "public, max-age=3600" always;
        try_files $uri =404;
    }
    location = /registerSW.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        try_files $uri =404;
    }

    # Favicons + logos
    location ~* \.(png|ico|svg|jpg|jpeg|gif|webp|woff2?|ttf|otf)$ {
        expires 30d;
        add_header Cache-Control "public" always;
        try_files $uri =404;
    }

    # ──────────────────────────────────────────────────────────
    # 2) Reverse proxy Django — API + admin + media
    # ──────────────────────────────────────────────────────────
    location /api/ {
        proxy_pass http://django_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # Traefik injecte déjà X-Forwarded-Proto, on le propage tel quel.
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_set_header X-Forwarded-Host $host;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
        proxy_connect_timeout 5s;
        proxy_buffering off;
    }

    # /admin/super/ = admin Django (superuser). L'URL /admin/ pure
    # est intentionnellement laissée au fallback SPA (React Router
    # sert l'espace admin plateforme via AdminShell).
    location /admin/super/ {
        proxy_pass http://django_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_read_timeout 120s;
    }

    # Legacy — Django peut redirect vers /accounts/login/?next=…
    # (compat @login_required). On proxifie pour laisser Django gérer
    # la redirection vers LOGIN_URL configuré (=/login).
    location /accounts/ {
        proxy_pass http://django_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    }

    # Django admin allauth (login/logout HTML si jamais utilisé
    # en interne pour dépannage). Proxy vers Django sinon 404.
    location /account/ {
        proxy_pass http://django_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    }

    # Statics de l'admin Django (collectstatic les met dans /static/admin/)
    location /static/ {
        proxy_pass http://django_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        expires 7d;
        add_header Cache-Control "public" always;
    }

    # Media (uploads utilisateur si servis par Django ; MinIO passe direct)
    location /media/ {
        proxy_pass http://django_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        expires 30d;
        add_header Cache-Control "public" always;
    }

    # ──────────────────────────────────────────────────────────
    # 3) Fallback SPA — toute autre URL renvoie index.html
    #    (React Router prend le relais côté client)
    # ──────────────────────────────────────────────────────────
    location / {
        try_files $uri $uri/ /index.html;
        # index.html : jamais de cache — pour recevoir immédiatement
        # les nouvelles versions après un deploy.
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;

        # Ce `add_header` local annule l'héritage de ceux du niveau server
        # (cf. le commentaire du bloc sécurité plus haut). C'est ici que la
        # CSP compte vraiment : `location /` sert `index.html`, le document
        # auquel la policy s'applique. Garder synchronisé avec le bloc server.
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Content-Security-Policy $csp_policy always;
    }
}
