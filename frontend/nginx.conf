# ═══════════════════════════════════════════════════════════════════
# Best-Épargne — Config nginx SPA + reverse proxy Django (R26)
# ═══════════════════════════════════════════════════════════════════
# Sert le bundle React (/usr/share/nginx/html) et reverse-proxie vers
# le backend Django (`bestweb:8000`) pour :
#   /api/*         → API REST + JWT
#   /admin/*       → admin Django
#   /media/*       → uploads utilisateur (si servis via Django)
#   /static/admin/ → assets de l'admin Django
#
# Traefik met déjà le SSL en amont, ce nginx écoute en HTTP nu sur :80.

# ──────────────────────────────────────────────────────────────
# Upstream Django (nom du service docker-compose)
# ──────────────────────────────────────────────────────────────
upstream django_backend {
    server bestweb:8000;
    keepalive 32;
}

# ──────────────────────────────────────────────────────────────
# Compression gzip (nginx apporte gzip_static aussi si assets pré-compressés)
# ──────────────────────────────────────────────────────────────
gzip on;
gzip_vary on;
gzip_min_length 1024;
gzip_proxied any;
gzip_types
    application/javascript
    application/json
    application/xml
    application/xml+rss
    text/css
    text/javascript
    text/plain
    text/xml
    image/svg+xml
    font/ttf
    font/otf
    font/woff
    font/woff2;

# ──────────────────────────────────────────────────────────────
# Server principal
# ──────────────────────────────────────────────────────────────
server {
    listen 80 default_server;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Sécurité de base — Traefik ajoute HSTS/HTTPS en amont.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Uploads (10 Mo) — cohérent avec DATA_UPLOAD_MAX_MEMORY_SIZE côté Django.
    client_max_body_size 12M;

    # ──────────────────────────────────────────────────────────
    # Healthcheck local (utilisé par HEALTHCHECK Docker)
    # ──────────────────────────────────────────────────────────
    location = /healthz {
        access_log off;
        return 200 "ok\n";
        default_type text/plain;
    }

    # ──────────────────────────────────────────────────────────
    # 1) Assets statiques SPA — cache long car hashés par Vite
    # ──────────────────────────────────────────────────────────
    location /assets/ {
        access_log off;
        expires 1y;
        add_header Cache-Control "public, immutable" always;
        try_files $uri =404;
    }

    # PWA files — pas de cache long (fichier signé par workbox)
    location = /sw.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        try_files $uri =404;
    }
    location = /manifest.webmanifest {
        add_header Cache-Control "public, max-age=3600" always;
        try_files $uri =404;
    }
    location = /registerSW.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        try_files $uri =404;
    }

    # Favicons + logos
    location ~* \.(png|ico|svg|jpg|jpeg|gif|webp|woff2?|ttf|otf)$ {
        expires 30d;
        add_header Cache-Control "public" always;
        try_files $uri =404;
    }

    # ──────────────────────────────────────────────────────────
    # 2) Reverse proxy Django — API + admin + media
    # ──────────────────────────────────────────────────────────
    location /api/ {
        proxy_pass http://django_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # Traefik injecte déjà X-Forwarded-Proto, on le propage tel quel.
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_set_header X-Forwarded-Host $host;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
        proxy_connect_timeout 5s;
        proxy_buffering off;
    }

    location /admin/ {
        proxy_pass http://django_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_read_timeout 120s;
    }

    # Statics de l'admin Django (collectstatic les met dans /static/admin/)
    location /static/ {
        proxy_pass http://django_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        expires 7d;
        add_header Cache-Control "public" always;
    }

    # Media (uploads utilisateur si servis par Django ; MinIO passe direct)
    location /media/ {
        proxy_pass http://django_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        expires 30d;
        add_header Cache-Control "public" always;
    }

    # ──────────────────────────────────────────────────────────
    # 3) Fallback SPA — toute autre URL renvoie index.html
    #    (React Router prend le relais côté client)
    # ──────────────────────────────────────────────────────────
    location / {
        try_files $uri $uri/ /index.html;
        # index.html : jamais de cache — pour recevoir immédiatement
        # les nouvelles versions après un deploy.
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    }
}
