name: Frontend

on:
  push:
    branches: [main, develop, refonte-react]
    paths:
      - 'frontend/**'
      - '.github/workflows/frontend.yml'
  pull_request:
    branches: [main, develop]
    paths:
      - 'frontend/**'
      - '.github/workflows/frontend.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ─────────────────────────────────────────────────────────────
  # Typecheck + build Vite (SPA React R8)
  # ─────────────────────────────────────────────────────────────
  build:
    name: Typecheck + Build
    runs-on: ubuntu-latest
    timeout-minutes: 12
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install deps
        run: npm ci

      - name: TypeScript check
        run: npm run typecheck

      - name: Lint (non-bloquant)
        run: npm run lint --if-present
        continue-on-error: true

      - name: Build
        run: npm run build
        env:
          VITE_API_URL: https://ayo-group.com

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist-${{ github.run_id }}
          path: frontend/dist
          retention-days: 7

  # ─────────────────────────────────────────────────────────────
  # E2E Playwright smoke (public only, backend absent OK)
  # ─────────────────────────────────────────────────────────────
  e2e-smoke:
    name: Playwright smoke
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [build]
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main'
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install deps
        run: npm ci

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-chromium

      - name: Install Playwright (chromium only)
        run: npx playwright install --with-deps chromium

      - name: Build
        run: npm run build
        env:
          VITE_API_URL: http://localhost:8000

      - name: Serve preview
        run: |
          npm run preview -- --port 5173 --host 0.0.0.0 &
          # Attend que le serveur soit prêt (max 30s)
          for i in $(seq 1 30); do
            curl -sf http://localhost:5173/ > /dev/null && break || sleep 1
          done

      - name: Run Playwright — smoke only
        run: npx playwright test e2e/smoke.spec.ts
        env:
          CI: 'true'
          PLAYWRIGHT_BASE_URL: http://localhost:5173

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ github.run_id }}
          path: frontend/playwright-report/
          retention-days: 7
