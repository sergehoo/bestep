name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install ruff
        run: pip install ruff==0.6.9

      - name: ruff lint
        run: ruff check .

      - name: ruff format new Python files
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [[ -z "$BASE_SHA" || "$BASE_SHA" =~ ^0+$ ]]; then
            BASE_SHA="$(git rev-list --max-parents=0 HEAD)"
          fi
          mapfile -d '' files < <(git diff --name-only --diff-filter=A -z "$BASE_SHA" HEAD -- '*.py')
          if (( ${#files[@]} )); then
            ruff format --check "${files[@]}"
          fi

  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: best_epargne_test
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      DJANGO_SETTINGS_MODULE: best_epargne.settings.dev
      DJANGO_SECRET_KEY: ci-secret-key-not-prod
      DJANGO_DEBUG: "1"
      DB_NAME: best_epargne_test
      DB_USER: ci
      DB_PASSWORD: ci
      DB_HOST: localhost
      DB_PORT: "5432"
      REDIS_URL: redis://localhost:6379/1
      CELERY_BROKER_URL: redis://localhost:6379/0
      MINIO_ROOT_USER: ci
      MINIO_ROOT_PASSWORD: ci
      MINIO_BUCKET: bestepargne-ci
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install system deps
        run: |
          sudo apt-get update -y
          sudo apt-get install -y ffmpeg libpq-dev

      - name: Install Python deps
        run: |
          pip install -r requirements.txt
          pip install pytest-cov

      - name: Enable pg_trgm extension
        env:
          PGPASSWORD: ci
        run: |
          psql -h localhost -U ci -d best_epargne_test \
            -c "CREATE EXTENSION IF NOT EXISTS pg_trgm;"

      - name: Migrate
        run: python manage.py migrate --noinput

      - name: Validate OpenAPI schema
        run: python manage.py spectacular --file /tmp/openapi.yml --validate --fail-on-warn

      - name: Tests
        run: pytest tests/ -v --cov=. --cov-report=xml --cov-report=term

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ github.run_id }}
          path: coverage.xml

  security:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: pip-audit (CVE check)
        run: |
          pip install pip-audit
          pip-audit --requirement requirements.txt --strict

      - name: Django security check
        env:
          DJANGO_SETTINGS_MODULE: best_epargne.settings.prod
          DJANGO_SECRET_KEY: ci-secret-key-for-security-checks-only-2026-not-for-runtime
          DJANGO_DEBUG: "0"
          DJANGO_ALLOWED_HOSTS: example.com
          POSTGRES_PASSWORD: dummy
        run: |
          pip install -r requirements.txt
          python manage.py check --deploy --tag security --fail-level WARNING

  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [lint, tests]
    steps:
      - uses: actions/checkout@v4

      - name: Build image
        run: docker build -t best-epargne:${{ github.sha }} .

      - name: Trivy scan
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: best-epargne:${{ github.sha }}
          severity: HIGH,CRITICAL
          exit-code: "1"
          ignore-unfixed: true
