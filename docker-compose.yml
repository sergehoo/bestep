networks:
  proxy:
    external: true
  internal:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  minio_data:

services:
  bestDB:
    image: postgres:16-alpine
    container_name: best_epargne_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-best_epargne}
      POSTGRES_USER: ${POSTGRES_USER:-best_epargne}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-best_epargne_pwd}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB -h 127.0.0.1 -p 5432 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: best_epargne_redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    networks:
      - internal
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 10

  bestminio:
    image: minio/minio:latest
#    container_name: best_epargne_minio
    restart: unless-stopped
    env_file:
      - .env
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      MINIO_SERVER_URL: https://${MINIO_PUBLIC_DOMAIN}
      MINIO_BROWSER_REDIRECT_URL: https://${MINIO_CONSOLE_DOMAIN}
      MINIO_API_CORS_ALLOW_ORIGIN: "https://ayo-group.com,https://www.ayo-group.com"
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data
    networks:
      - internal
      - proxy
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=proxy"

      - "traefik.http.services.best-minio.loadbalancer.server.port=9000"
      - "traefik.http.services.best-minio-console.loadbalancer.server.port=9001"

      - "traefik.http.routers.best-minio.rule=Host(`${MINIO_PUBLIC_DOMAIN}`)"
      - "traefik.http.routers.best-minio.entrypoints=websecure"
      - "traefik.http.routers.best-minio.tls=true"
      - "traefik.http.routers.best-minio.tls.certresolver=${TRAEFIK_CERTRESOLVER:-lets}"
      - "traefik.http.routers.best-minio.service=best-minio"
      - "traefik.http.routers.best-minio.middlewares=best-minio-sec-headers,best-minio-compress"

      - "traefik.http.routers.best-minio-console.rule=Host(`${MINIO_CONSOLE_DOMAIN}`)"
      - "traefik.http.routers.best-minio-console.entrypoints=websecure"
      - "traefik.http.routers.best-minio-console.tls=true"
      - "traefik.http.routers.best-minio-console.tls.certresolver=${TRAEFIK_CERTRESOLVER:-lets}"
      - "traefik.http.routers.best-minio-console.service=best-minio-console"
      - "traefik.http.routers.best-minio-console.middlewares=best-minio-sec-headers,best-minio-compress"

      - "traefik.http.middlewares.best-minio-sec-headers.headers.stsSeconds=31536000"
      - "traefik.http.middlewares.best-minio-sec-headers.headers.browserXssFilter=true"
      - "traefik.http.middlewares.best-minio-sec-headers.headers.contentTypeNosniff=true"
      - "traefik.http.middlewares.best-minio-sec-headers.headers.referrerPolicy=strict-origin-when-cross-origin"
      - "traefik.http.middlewares.best-minio-compress.compress=true"


    # Healthcheck retiré ici pour éviter les faux négatifs liés aux outils absents
    # MinIO peut être parfaitement démarré même si curl/wget ne sont pas dans l'image

  createbucket:
    image: minio/mc:latest
    container_name: best_epargne_minio_init
    restart: "no"
    env_file:
      - .env
    depends_on:
      - bestminio
    networks:
      internal:
        aliases:
          - bestminio
      proxy:
        aliases:
          - bestminio
    entrypoint: >
      /bin/sh -c "
      until mc alias set local http://bestminio:9000 ${MINIO_ROOT_USER} ${MINIO_ROOT_PASSWORD}; do
        echo 'Attente MinIO...';
        sleep 3;
      done;
      mc mb -p local/${MINIO_BUCKET:-bestepargne} || true;
      mc anonymous set none local/${MINIO_BUCKET:-bestepargne} || true;
      echo 'Bucket prêt.';
      "

  bestweb:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: bestweb
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DJANGO_SETTINGS_MODULE: ${DJANGO_SETTINGS_MODULE:-best_epargne.settings.prod}
      DJANGO_DEBUG: ${DJANGO_DEBUG:-0}
      MINIO_PUBLIC_DOMAIN: ${MINIO_PUBLIC_DOMAIN:-minio.ayo-group.com}

      POSTGRES_DB: ${POSTGRES_DB:-best_epargne}
      POSTGRES_USER: ${POSTGRES_USER:-best_epargne}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-best_epargne_pwd}
      DB_HOST: ${DB_HOST:-bestDB}
      DB_PORT: ${DB_PORT:-5432}

      REDIS_URL: ${REDIS_URL:-redis://redis:6379/1}
      CELERY_BROKER_URL: ${CELERY_BROKER_URL:-redis://redis:6379/0}
      CELERY_RESULT_BACKEND: ${CELERY_RESULT_BACKEND:-redis://redis:6379/0}

      MINIO_INTERNAL_ENDPOINT: ${MINIO_INTERNAL_ENDPOINT:-http://bestminio:9000}
      MINIO_PUBLIC_ENDPOINT: ${MINIO_PUBLIC_ENDPOINT:-https://minio.ayo-group.com}
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      MINIO_BUCKET: ${MINIO_BUCKET}

      USE_X_FORWARDED_HOST: "true"
      SECURE_PROXY_SSL_HEADER: "HTTP_X_FORWARDED_PROTO,https"

    depends_on:
      bestDB:
        condition: service_healthy
      redis:
        condition: service_healthy
      bestminio:
        condition: service_started
      createbucket:
        condition: service_completed_successfully

    networks:
      - internal
      - proxy

    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=proxy"
      - "traefik.http.routers.best-epargne.rule=Host(`${APP_HOST}`)"
      - "traefik.http.routers.best-epargne.entrypoints=websecure"
      - "traefik.http.routers.best-epargne.tls=true"
      - "traefik.http.routers.best-epargne.tls.certresolver=${TRAEFIK_CERTRESOLVER:-lets}"
      - "traefik.http.services.best-epargne.loadbalancer.server.port=${APP_PORT:-8000}"


    command:
      [
        "sh","-c",
        "python manage.py migrate --noinput && python manage.py collectstatic --noinput && gunicorn best_epargne.wsgi:application --bind 0.0.0.0:${APP_PORT:-8000} --workers ${GUNICORN_WORKERS:-3} --timeout ${GUNICORN_TIMEOUT:-120}"
      ]

  celery:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: best_epargne_celery
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DJANGO_SETTINGS_MODULE: ${DJANGO_SETTINGS_MODULE:-best_epargne.settings.prod}

      POSTGRES_DB: ${POSTGRES_DB:-best_epargne}
      POSTGRES_USER: ${POSTGRES_USER:-best_epargne}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-best_epargne_pwd}
      DB_HOST: ${DB_HOST:-bestDB}
      DB_PORT: ${DB_PORT:-5432}

      REDIS_URL: ${REDIS_URL:-redis://redis:6379/1}
      CELERY_BROKER_URL: ${CELERY_BROKER_URL:-redis://redis:6379/0}
      CELERY_RESULT_BACKEND: ${CELERY_RESULT_BACKEND:-redis://redis:6379/0}

      MINIO_ENDPOINT: ${MINIO_ENDPOINT:-http://bestminio:9000}
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin123}
      MINIO_BUCKET: ${MINIO_BUCKET:-bestepargne}

    depends_on:
      bestDB:
        condition: service_healthy
      redis:
        condition: service_healthy
      bestweb:
        condition: service_started

    networks:
      - internal

    command: ["celery", "-A", "best_epargne", "worker", "-l", "info"]


  celery_beat:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: best_epargne_celery_beat
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DJANGO_SETTINGS_MODULE: ${DJANGO_SETTINGS_MODULE:-best_epargne.settings.prod}

      POSTGRES_DB: ${POSTGRES_DB:-best_epargne}
      POSTGRES_USER: ${POSTGRES_USER:-best_epargne}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-best_epargne_pwd}
      DB_HOST: ${DB_HOST:-bestDB}
      DB_PORT: ${DB_PORT:-5432}

      REDIS_URL: ${REDIS_URL:-redis://redis:6379/1}
      CELERY_BROKER_URL: ${CELERY_BROKER_URL:-redis://redis:6379/0}
      CELERY_RESULT_BACKEND: ${CELERY_RESULT_BACKEND:-redis://redis:6379/0}

      MINIO_ENDPOINT: ${MINIO_ENDPOINT:-http://bestminio:9000}
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin123}
      MINIO_BUCKET: ${MINIO_BUCKET:-bestepargne}

    depends_on:
      bestDB:
        condition: service_healthy
      redis:
        condition: service_healthy
      bestweb:
        condition: service_started

    networks:
      - internal

    command: ["celery", "-A", "best_epargne", "beat", "-l", "info"]