# .pre-commit-config.yaml — V8.B.
#
# Installation : `pre-commit install`.
# Lancement manuel : `pre-commit run --all-files`.

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-merge-conflict
      - id: check-added-large-files
        args: ["--maxkb=5000"]
      - id: detect-private-key
      - id: mixed-line-ending

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.6.9
    hooks:
      - id: ruff
        args: ["--fix"]
      - id: ruff-format

  - repo: https://github.com/PyCQA/isort
    rev: 5.13.2
    hooks:
      - id: isort

  - repo: local
    hooks:
      - id: no-print
        name: no print()/pprint() in apps
        language: pygrep
        entry: "(?:^|\\s)print\\("
        files: '^(compte|catalog|organizations|enrollments|commerce|certifications|assessments|reviews|formations|core|best_epargne)/.*\\.py$'
        exclude: 'tests/|management/'
